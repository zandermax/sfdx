name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

permissions:
  contents: write # for semantic-release to push the release commit/tag
  issues: write # for semantic-release to comment on related issues
  pull-requests: write # for semantic-release to comment on related PRs
  id-token: write # for npm --provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          always-auth: true

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
